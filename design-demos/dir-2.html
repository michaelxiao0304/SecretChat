</style>
<style>
.detail {
  min-width: 0;
  align-self: center;
}
.ticket {
  position: relative;
  background: var(--paper);
  padding: 29px 29px 22px;
  filter: drop-shadow(0 8px 9px #29493312);
  border-radius: 19px 19px 0 0;
  border: 1px solid #c5d5c4;
  border-bottom: 0;
}
.ticket::after {
  content: "";
  position: absolute;
  left: -1px;
  bottom: -8px;
  width: calc(100% + 2px);
  height: 9px;
  background:
    linear-gradient(
      135deg,
      var(--paper) 26%,
      transparent 26%) 0 0/16px 16px repeat-x,
    linear-gradient(
      225deg,
      var(--paper) 26%,
      transparent 26%) 0 0/16px 16px repeat-x;
}
.ticket-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ticket-head h2 {
  font-size: 27px;
  letter-spacing: -.055em;
  line-height: 1.2;
  margin: 0;
}
.ticket-head .i {
  font-size: 22px;
  color: #62826d;
}
.ticket blockquote {
  font-size: 16px;
  margin: 17px 0 19px;
  line-height: 1.55;
}
.cutline {
  position: relative;
  border-top: 1px dashed #9fb4a3;
  margin: 0 -29px;
}
.cutline::before,
.cutline::after {
  content: "";
  position: absolute;
  top: -7px;
  background: var(--board);
  width: 14px;
  height: 14px;
  border-radius: 50%;
}
.cutline::before {
  left: -7px;
}
.cutline::after {
  right: -7px;
}
.steps {
  margin: 16px 0 10px;
}
.step {
  position: relative;
  display: grid;
  grid-template-columns: 41px 1fr auto;
  align-items: center;
  gap: 13px;
  min-height: 65px;
  padding: 7px 0;
}
.node {
  width: 39px;
  height: 39px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 22px;
}
.node.done {
  color: #305f41;
  background: #dcecd9;
}
.node.current {
  background: #315d42;
  color: #e9fae6;
}
.node.future {
  color: #7a8a79;
  background: none;
  border: 1px dashed #a4b3a0;
}
.step::before {
  content: "";
  position: absolute;
  left: 19px;
  top: 52px;
  height: 25px;
  border-left: 1px solid #a4b9a6;
}
.step:has(+ .step .future)::before {

}

.what strong {

  font-size: 15px;

  } else if (next === 0 && s.offline) {
    s.feedback = "首次发送需联网取得对方预密钥。恢复在线后可再发送。";
  } else {
    s.count++;
    s.selected = next;
    if (next === 0) s.first = 0;
    else s.phase = 0;
    s.draft = "";
    s.feedback = "";
  }
  render();
}
function issueCode() {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", bytes = new Uint8Array(8);
  crypto.getRandomValues(bytes);
  const raw = Array.from(bytes, (n) => alphabet[n % alphabet.length]).join("");
  return raw.slice(0, 4) + "-" + raw.slice(4);
}
async function copyCode() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(s.issued);
    ok = true;
  } catch {
    const x = document.createElement("textarea");
    x.value = s.issued;
    document.body.append(x);
    x.select();
    ok = document.execCommand("copy");
    x.remove();
  }
  s.modal = "";
  s.feedback = ok ? "邀请码已复制。" : "请选中邀请码并手动复制。";
  render();
}
document.addEventListener("input", (e) => {
  if (e.target.dataset.reg) {
    const key = e.target.dataset.reg;
    s.reg[key] = e.target.value;
    if (key === "email" || key === "base") s.reg.challenge = false;
  } else if (e.target.id === "draft") {
    s.draft = e.target.value;
    document.querySelector(".sendbtn").disabled = !s.draft.trim();
  }
});
document.addEventListener("toggle", (e) => {
  if (e.target.matches("details.dev")) s.reg.open = e.target.open;
}, true);
document.addEventListener("change", (e) => {
  if (e.target.id === "scene-select") go(e.target.value);
  if (e.target.dataset.act === "dev") {
    s.reg.dev = e.target.checked;
    s.reg.open = true;
    s.feedback = "";
    render();
  }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "register") register();
  else if (e.target.id === "compose-form") send();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && s.modal) {
    s.modal = "";
    render();
  }
});
document.addEventListener("click", async (e) => {
  let a = e.target.closest("[data-act]")?.dataset.act;
  if (!a && e.target.classList.contains("scrim")) a = "close";
  if (!a || a === "dev") return;
  if (a.startsWith("scene-")) {
    go(a.slice(6));
    return;
  }
  if (a.startsWith("receipt-")) {
    s.selected = Number(a.slice(-1));
    s.modal = "receipt";
  } else if (a.startsWith("phase-")) {
    if (s.paused) return;
    s.phase = Number(a.slice(-1));
    s.offline = s.phase === 0;
    s.selected = 2;
    s.feedback = "";
  } else if (a === "identity") {
    s.paused = true;
    s.modal = "";
    s.feedback = "";
  } else if (a === "close") s.modal = "";
  else if (a === "peer" || a === "reason") s.modal = a;
  else if (a === "back-contacts") {
    s.screen = "contacts";
    s.feedback = "";
    s.modal = "";
  } else if (a === "sample") {
    Object.assign(s.reg, { invite: "M7KD-29QP", email: "demo@example.test", code: "246810", challenge: true });
    s.feedback = "已填入测试数据，可注册设备。";
  } else if (a === "challenge") {
    if (!validBase() || !goodEmail()) s.feedback = "请填写有效邮箱及 HTTPS 服务地址。";
    else {
      s.reg.challenge = true;
      s.feedback = "本地演示验证码为 246810。";
    }
  } else if (a === "issue") {
    s.issued = issueCode();
    s.redeemed = false;
    s.feedback = "";
  } else if (a === "redeem") {
    s.redeemed = true;
    s.feedback = "";
  } else if (a === "copy") {
    await copyCode();
    return;
  } else if (a === "share") {
    if (navigator.share) {
      try {
        await navigator.share({ text: s.issued });
        s.feedback = "已打开系统分享。";
      } catch (err) {
        if (err.name !== "AbortError") s.modal = "share";
      }
    } else s.modal = "share";
  } else if (a === "refresh") {
    if (s.inviter || s.redeemed) {
      s.ready = true;
      s.feedback = "联系人目录已刷新。";
    } else s.feedback = "暂无新的联系人。";
  } else if (a === "enter") {
    s.screen = "chat";
    s.feedback = "";
    s.draft = s.count === 0 ? lines[0] : s.count === 2 ? lines[2] : "";
  } else if (a === "reply") {
    if (s.paused || s.count !== 1) return;
    s.count = 2;
    s.first = 2;
    s.offline = false;
    s.draft = lines[2];
    s.feedback = "";
  } else if (a === "network") {
    if (s.paused) return;
    s.offline = !s.offline;
    s.feedback = s.offline ? "当前设备离线。" : "当前设备在线。";
  } else if (a === "fill-draft") {
    s.draft = s.count === 0 ? lines[0] : s.count === 2 ? lines[2] : "";
    s.feedback = "";
  } else if (a === "show-sim") {
    el("sim").scrollIntoView({ block: "center" });
    return;
  } else if (a === "show-phone") {
    document.querySelector(".mobilebar").scrollIntoView({ block: "start" });
    return;
  }
  render();
});
render();
</script></body></html>
