<script>

}
function register() {
  return appBar("<b>SecretChat</b>", '<span class="status">受邀注册</span>') + '<section class="page"><h2>接受邀请</h2><p class="sub">用邮箱和一次性邀请码建立你的设备账号。</p><form id="reg" novalidate><label class="label">一次性邀请码<input data-field="invite" placeholder="输入对方分享的码" value="' + esc(fields.invite) + '"></label><label class="label">邮箱<input data-field="email" type="email" placeholder="name@example.com" value="' + esc(fields.email) + '"></label>' + (!fields.dev ? challenge ? '<label class="label">邮箱验证码<input data-field="code" inputmode="numeric" maxlength="6" placeholder="六位数字" value="' + esc(fields.code) + '"></label><div class="status">演示验证码 246810</div>' : btn("challenge", "获取邮箱验证码", "quiet") : "") + sample() + '<div class="error" role="status">' + esc(alertText) + '</div><button class="action" type="submit">注册并打开联系人</button></form>' + codeSettings() + "</section>";
}
function directory() {
  return appBar("<b>SecretChat</b>", btn("dev", "开发联调")) + '<section class="page"><h2>联系人</h2><div class="index-head"><span>联系人索引</span><span>' + Number(contact) + " 位联系人</span></div>" + (contact ? '<button class="contact" data-act="chat"><i aria-hidden="true">7a</i><span><b>' + peer + "</b><small>" + (paused ? "设备身份已变化" : "身份未核验") + '</small></span><span aria-hidden="true">›</span></button>' : '<div class="empty-mark" aria-hidden="true">「　」</div><h3>第一位联系人</h3><p class="sub">已凭对方邀请注册？刷新联系人。你也可以生成单次邀请码，邀请朋友加入。</p>') + btn("refresh", "刷新联系人", "quiet") + btn("issue", "生成单次邀请码", "quiet") + (issued ? '<div class="idcard"><div class="status">可分享的一次性邀请码</div><b class="short">' + issued + "</b>" + (invitationUsed ? '<p class="status">此邀请码已使用。</p>' : btn("copy", shared ? "已复制" : "复制邀请码") + '<div class="scenario">' + btn("consume", "模拟对方用此码完成注册") + "</div>") + "</div>" : "") + '<div class="status" role="status">' + esc(alertText) + "</div></section>";
}
function item(who, t, s) {
  return '<li class="entry" data-who="' + who + '"><header><span>' + { me: "我", peer: "对方" }[who] + "</span>" + (s ? "<small>" + labels[s] + "</small>" : "") + "</header><p>" + esc(t) + "</p></li>";
}
function demoTools() {
  if (!fresh || paused) return "";
  const last = localThread.at(-1);
  let actions = btn("network", localOffline ? "模拟恢复在线" : "模拟本机离线");
  if (!last || last.who === "peer") actions += btn("fill", "填入示例消息");
  else if (!localOffline && last.status === "pending") actions += btn("accept", "模拟服务端接收");
  else if (!localOffline && last.status === "accepted") actions += btn("reply", localThread.length === 1 ? "模拟对方设备收件并回复" : "模拟对方设备收件");
  return '<details class="scenario" open><summary>演示操作</summary><div>' + actions + "</div></details>";
}
function chat() {
  const cause = '<div class="cause"><b>设备身份已变化</b><p>本次目录记录与本机保存的设备身份不一致。新消息与待发重试均已暂停。</p>' + btn("identity", "查看身份说明") + "</div>";
  return appBar(btn("back-list", "‹ 联系人"), btn("identity", "身份信息")) + '<section class="page room"><div><span class="pin">与联系人往来</span><h2 class="roomid">' + peer + '</h2><div class="statusline">' + (paused ? "发送已暂停" : "身份未核验") + "</div></div>" + (paused ? cause : "") + '<ol class="thread msglist">' + (fresh ? localThread.map((m) => item(m.who, m.body, m.status)).join("") : item("me", dialogue[0], "received") + item("peer", dialogue[1]) + item("me", dialogue[2], stage) + custom.map((m) => item("me", m, stage)).join("")) + "</ol>" + (fresh ? (!localThread.length ? '<div class="aside">写下第一句话。首次建立会话时，这台设备需要在线获取对方的预密钥。</div>' : "") + demoTools() + '<div class="status" role="status">' + esc(alertText) + "</div>" : !paused ? '<div class="aside"><b>' + labels[stage] + "</b>　" + explain[stage] + "</div>" : "") + "</section>" + (paused ? '<div class="pausedfoot">发送与重试已暂停</div>' : '<form class="compose" id="send"><input aria-label="文字消息" data-field="draft" placeholder="写消息" value="' + esc(draft) + '"><button>发送</button></form>');
}
function draw() {
  tabs.innerHTML = presets.map(([k, n]) => '<button type="button" aria-pressed="' + (scene === k) + '" data-scene="' + k + '">' + n + "</button>").join("");
  const sampleStage = fresh && localThread.length >= 3 ? localThread[2].status : stage;
  document.querySelector("#leaf-state").textContent = labels[sampleStage] + (sampleStage === "pending" ? paused ? " · 因设备身份变化已暂停重试" : " · 已保存在本机" : "");
  let html = "";
  if (screen === "register") html = register();
  if (screen === "directory") html = directory();
  if (screen === "chat") html = chat();
  if (screen === "identity") html = appBar(btn("back-chat", "‹ 对话"), "<b>SecretChat</b>") + '<section class="page"><h2>设备身份</h2><div class="idcard"><div class="status">联系人短号</div><b class="short">' + peer + "</b></div>" + (paused ? '<h3>发送已暂停</h3><p>联系人目录返回的设备标识或身份公钥，与本机保存的绑定不同。</p><p class="sub">请先通过双方已信任的其他渠道确认是否更换设备。当前版本会保留历史消息，并继续暂停新发和重试。</p>' : '<h3>身份未核验</h3><p class="sub">短号帮助你找到这段对话。首次建立的本机绑定用于识别后续设备变化。</p>') + btn("back-chat", "返回对话", "quiet") + "</section>";
  if (screen === "dev") html = appBar(btn("back-list", "‹ 联系人"), "<b>SecretChat</b>") + '<section class="page"><h2>开发联调</h2><p class="sub">服务与注册设置只作用于此离线演示。</p>' + codeSettings() + btn("save-dev", "保存设置", "quiet") + '<p class="error">' + esc(alertText) + "</p></section>";
  app.innerHTML = '<div class="app">' + html + "</div>";
}
function issue(v) {
  alertText = v;
  draw();
}
tabs.addEventListener("click", (e) => {
  const b = e.target.closest("[data-scene]");
  if (b) setScene(b.dataset.scene);
});
app.addEventListener("input", (e) => {
  const k = e.target.dataset.field;
  if (!k) return;
  if (k === "draft") {
    draft = e.target.value;
    return;
  }
  if (k === "dev") {
    fields.dev = e.target.checked;
    expandedSettings = true;
    challenge = false;
    draw();
    return;
  }
  fields[k] = e.target.value;
  if ((k === "email" || k === "server") && challenge) {
    challenge = false;
    fields.code = "";
  }
});
app.addEventListener("toggle", (e) => {
  if (e.target.tagName === "DETAILS") expandedSettings = e.target.open;
}, true);
app.addEventListener("click", async (e) => {
  const k = e.target.closest("[data-act]")?.dataset.act;
  if (!k) return;
  if (k === "sample") {
    fields.email = demoMail;
    fields.invite = demoInvite;
    fields.code = demoCode;
    challenge = true;
    issue("演示资料已填入。");
  }
  if (k === "challenge") {
    if (!validEmail()) return issue("请先填写有效邮箱。");
    if (!validServer()) return issue("请在开发联调中填写有效的 HTTPS 地址。");
    challenge = true;
    issue("本页模拟验证码邮件。");
  }
  if (k === "dev") {
    expandedSettings = true;
    show("dev");
  }
  if (k === "save-dev") {
    if (!validServer()) return issue("请填写有效的 HTTPS 地址。");
    scene = contact ? "directory" : "empty";
    show("directory");
  }
  if (k === "back-list") {
    scene = contact ? "directory" : "empty";
    show("directory");
  }
  if (k === "consume" && issued && !invitationUsed) {
    invitationUsed = true;
    issue("对方已在演示中注册。刷新联系人即可查看。");
  }
  if (k === "refresh") {
    if (!contact && !expectInviter && !invitationUsed) return issue("列表仍为空。可以生成邀请码，再请朋友凭码注册。");
    contact = true;
    scene = "directory";
    issue("目录已同步。");
  }
  if (k === "issue") {
    issued = issued || "Q8RL-6PZT";
    issue("可将邀请码发给准备注册的朋友。");
  }
  if (k === "copy") {
    try {
      await navigator.clipboard.writeText(issued);
      shared = true;
      issue("邀请码已复制。");
    } catch {
      issue("请选中上方邀请码并复制。");
    }
  }
  if (k === "chat" || k === "back-chat") {
    scene = paused ? "paused" : stage;
    show("chat");
  }
  if (k === "fill") {
    draft = dialogue[localThread.length === 0 ? 0 : 2];
    draw();
    app.querySelector("[data-field=draft]")?.focus();
  }
  if (k === "network") {
    localOffline = !localOffline;
    issue(localOffline ? "演示设备已离线。" : "演示设备已恢复在线。");
  }
  if (k === "accept" && !localOffline && localThread.length) {
    localThread.at(-1).status = "accepted";
    issue("服务端已接收密文。");
  }
  if (k === "reply" && !localOffline && localThread.length) {
    localThread.at(-1).status = "received";
    if (localThread.length === 1) localThread.push({ who: "peer", body: dialogue[1] });
    issue("对方设备已确认收件，阅读情况未知。");
  }
  if (k === "identity") show("identity");
});
app.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "send") {
    if (!paused && draft.trim()) {
      if (fresh && localOffline && !localThread.length) return issue("首次建立会话需要在线获取对方预密钥，草稿已保留。");
      if (fresh) {
        localThread.push({ who: "me", body: draft.trim(), status: "pending" });
        alertText = localOffline ? "已保存在本机，联网后会尝试提交。" : "消息已进入本机待提交队列。";
      } else custom.push(draft.trim());
      draft = "";
      draw();
      const p = app.querySelector(".page");
      p.scrollTop = p.scrollHeight;
    }
    return;
  }
  if (!validServer()) return issue("请在开发联调中填写有效 HTTPS 服务地址。");
  if (fields.invite.trim() !== demoInvite) return issue("本演示使用邀请码 M7KD-29QP。");
  if (!validEmail()) return issue("请填写有效邮箱。");
  if (!fields.dev && (!challenge || fields.code !== demoCode)) return issue("请先获取并填写演示验证码 246810。");
  setScene("empty");
  expectInviter = true;
});
draw();
</script></body></html>
