server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SECRETCHAT_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.path=${SECRETCHAT_COOKIE_PATH:/}
secretchat.admin.username=${SECRETCHAT_ADMIN_USERNAME:admin}
secretchat.admin.password=${SECRETCHAT_ADMIN_PASSWORD:}
spring.datasource.url=${SECRETCHAT_DB_URL}
spring.datasource.username=${SECRETCHAT_DB_USERNAME}
spring.datasource.password=${SECRETCHAT_DB_PASSWORD}
spring.sql.init.mode=never
